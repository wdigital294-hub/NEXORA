<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17222B">
<title>{% block title %}Painel — {{ PLATFORM_NAME }}{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="painel">
  <aside class="lateral">
    <div class="marca">NEX<span>ORA</span></div>
    <nav>{% block nav %}{% endblock %}</nav>
    <div class="rodape">
      <form method="post" action="{{ url_for('auth.logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="btn btn-linha btn-pq" style="color:#C9D6DE">Terminar sessão</button>
      </form>
    </div>
  </aside>
  <main class="conteudo">
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in msgs %}<div class="aviso aviso-{{ cat }}" style="margin-bottom:1rem;border-radius:8px">{{ msg }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</div>
{% block scripts %}{% endblock %}
</body>
</html>
