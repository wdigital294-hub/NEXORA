<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6E5E">
<title>{% block title %}{{ PLATFORM_NAME }}{% endblock %}</title>
<link rel="manifest" href="{{ url_for('public.manifest') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block head %}{% endblock %}
</head>
<body>
<div class="avisos">
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in msgs %}<div class="aviso aviso-{{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
</div>
{% block body %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
