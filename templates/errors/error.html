{% extends "base_public.html" %}
{% block title %}{{ titulo }} — {{ PLATFORM_NAME }}{% endblock %}
{% block body %}
<div class="wrap" style="max-width:520px;padding-top:5rem;text-align:center">
  <div class="numero" style="color:var(--tinta-fraca)">{{ codigo }}</div>
  <h1>{{ titulo }}</h1>
  <p class="mudo">{{ detalhe }}</p>
  <a class="btn" href="{{ url_for('public.landing') }}">Voltar ao início</a>
</div>
{% endblock %}
